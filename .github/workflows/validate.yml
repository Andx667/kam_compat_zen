name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Stringtables
        run: python3 tools/stringtable_validator.py

      - name: Validate Config
        run: python tools/config_style_checker.py
